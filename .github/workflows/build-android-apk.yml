name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Build Offline Assets
        run: |
          pip install Pillow
          if [ ! -f "data/mooncell.sqlite3" ]; then python restore_data.py; fi
          python -X utf8 build_app_data.py
          python -X utf8 collect_events_banners.py
          python -X utf8 download_assets.py --workers 16

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend & Capacitor Dependencies
        working-directory: ./app
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mooncell-FGO-Android-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
