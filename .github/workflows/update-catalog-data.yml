name: Update Mooncell & Atlas Catalog Data

on:
  schedule:
    # 每天北京时间 19:23 (UTC 11:23) 避开整半点队列拥堵，自动检查并更新全量离线数据包
    - cron: '23 11 * * *'
    # 每天北京时间 20:17 (UTC 12:17) 兜底一次（若无数据变更不会产生多余提交）
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Restore Mooncell SQLite cache
        uses: actions/cache@v4
        with:
          path: data/mooncell.sqlite3
          key: mooncell-sqlite-${{ github.run_id }}
          restore-keys: |
            mooncell-sqlite-

      - name: Restore baseline Mooncell SQLite if cache miss
        run: |
          if [ ! -f "data/mooncell.sqlite3" ] && [ -f "offline-data/manifest.json" ]; then
            python -X utf8 restore_data.py
          fi

      - name: Run incremental catalog & story data sync
        run: python -X utf8 update_cloud_data.py --check-all-ces

      - name: Commit & push updated JSON data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/ app/public/assets/story/
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            CHANGED_FILES=$(git diff --cached --name-only -- app/public/data/)
            git commit -m "chore(data): auto-update Mooncell & Atlas catalog data"
            git push
            # 主动触发 jsDelivr 缓存刷新，避免国内线路拉取到旧版 @main 缓存
            for f in $CHANGED_FILES; do
              curl -fsS --max-time 10 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" >/dev/null || true
            done
          fi
